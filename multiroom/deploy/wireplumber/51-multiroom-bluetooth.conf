# Multiroom speaker bridge — WirePlumber 0.5+ (Raspberry Pi OS / Debian 13 "trixie")
# Installed by deploy/install-agent.sh into ~/.config/wireplumber/wireplumber.conf.d/
#
# 1. Never use Bluetooth "absolute volume" (AVRCP). The speaker's own volume is left
#    exactly where you set it; the bridge's player (mpv) does all volume in software.
# 2. A2DP only (no hands-free/headset profile), with the higher-quality SBC-XQ mode.
# 3. Keep the Bluetooth stream open between songs, so speakers don't clip the first
#    second of each track or fall asleep while paused briefly.
# 4. Headless bridge: manage Bluetooth even though nobody is logged in on a screen.

wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}

monitor.bluez.properties = {
  bluez5.enable-hw-volume = false
  bluez5.enable-sbc-xq = true
  bluez5.roles = [ a2dp_sink a2dp_source ]
}

monitor.bluez.rules = [
  {
    matches = [ { device.name = "~bluez_card.*" } ]
    actions = { update-props = { bluez5.hw-volume = [ ] } }
  }
  {
    matches = [ { node.name = "~bluez_output.*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
]
