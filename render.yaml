# Render blueprint: ONE free web service serving
#   /        the real app (password = MULTIROOM_TOKEN; music lives on your home Pi)
#   /demo/   the demo (simulated speakers, sample music)
services:
  - type: web
    name: home-audio
    runtime: node
    plan: free
    branch: claude/upbeat-edison-2k76xq
    buildCommand: cd multiroom && npm ci --omit=dev -w hub -w agent
    startCommand: cd multiroom && npm run site
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MULTIROOM_TOKEN   # the app password; set it in the Render dashboard, never in git
        sync: false
