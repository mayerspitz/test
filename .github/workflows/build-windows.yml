name: Build Windows app

on:
  push:
    branches:
      - claude/photo-video-consolidation-strategy-nye3wd
      - main
      - master
    paths:
      - "photorounds/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app and build tools
        run: |
          python -m pip install --upgrade pip
          pip install . pillow-heif rawpy pyinstaller

      - name: Run test suite
        run: |
          pip install pytest
          pytest -q

      - name: Bundle ExifTool into the app (best effort)
        continue-on-error: true
        shell: pwsh
        run: |
          $ver = (Invoke-WebRequest -Uri https://exiftool.org/ver.txt -UseBasicParsing).Content.Trim()
          Write-Host "ExifTool version: $ver"
          $urls = @(
            "https://downloads.sourceforge.net/project/exiftool/exiftool-${ver}_64.zip",
            "https://sourceforge.net/projects/exiftool/files/exiftool-${ver}_64.zip/download",
            "https://exiftool.org/exiftool-${ver}_64.zip"
          )
          $ok = $false
          foreach ($u in $urls) {
            try {
              # curl.exe (CLI user agent): SourceForge redirects tools straight to
              # the file but serves browser UAs an HTML interstitial page
              curl.exe -sSL --fail --max-time 120 -o et.zip "$u"
              if ($LASTEXITCODE -ne 0) { throw "curl exit code $LASTEXITCODE" }
              $sig = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes("et.zip")[0..1])
              if ($sig -ne "PK") { throw "not a zip file (server sent a web page)" }
              $ok = $true; Write-Host "downloaded from $u"; break
            } catch { Write-Host "source failed: $u -- $_" }
          }
          if (-not $ok) { throw "could not download ExifTool from any source" }
          Expand-Archive et.zip -DestinationPath et
          $exe = Get-ChildItem -Recurse et -Include "exiftool(-k).exe","exiftool.exe" | Select-Object -First 1
          if (-not $exe) { throw "exiftool exe not found in archive" }
          $dest = "packaging/bundled_tools/exiftool"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Recurse -Force "$($exe.DirectoryName)\*" $dest
          if (Test-Path "$dest/exiftool(-k).exe") { Rename-Item "$dest/exiftool(-k).exe" "exiftool.exe" }
          & "$dest/exiftool.exe" -ver

      - name: Ensure bundled tools folder exists
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path packaging/bundled_tools | Out-Null

      - name: Build PhotoRounds.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name PhotoRounds
          --collect-all pillow_heif --collect-all rawpy
          --add-data "packaging/bundled_tools;bundled_tools"
          packaging/app_entry.py

      - name: Report executable size
        shell: pwsh
        run: |
          $size = (Get-Item dist\PhotoRounds.exe).Length
          Write-Host ("PhotoRounds.exe size: {0:N0} bytes ({1:N1} MB)" -f $size, ($size / 1MB))
          $bundled = Test-Path packaging/bundled_tools/exiftool/exiftool.exe
          Write-Host "ExifTool bundled: $bundled"

      - name: Self-test the frozen executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\PhotoRounds.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoRounds-windows
          path: dist/PhotoRounds.exe

      - name: Publish to the app-latest release (stable download link)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="app-latest"
          notes="Standalone Windows app — download PhotoRounds.exe below and double-click to run.
          No installation needed. If Windows SmartScreen warns, click 'More info' then 'Run anyway'
          (the file is unsigned, which is normal for personal builds).
          HEIC, RAW and ExifTool support are built in; on first launch the app offers to fetch
          ffmpeg (video conversion) automatically — one click, no command line."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/PhotoRounds.exe --clobber
          else
            gh release create "$tag" dist/PhotoRounds.exe \
              --target "$GITHUB_SHA" \
              --title "PhotoRounds for Windows — latest build" \
              --notes "$notes"
          fi
