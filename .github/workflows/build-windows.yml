name: Build Windows app

on:
  push:
    branches:
      - claude/photo-video-consolidation-strategy-nye3wd
      - main
      - master
    paths:
      - "photorounds/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app and build tools
        run: |
          python -m pip install --upgrade pip
          pip install . pillow-heif rawpy pyinstaller

      - name: Run test suite
        run: |
          pip install pytest
          pytest -q

      - name: Build PhotoRounds.exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name PhotoRounds
          --collect-all pillow_heif --collect-all rawpy
          packaging/app_entry.py

      - name: Self-test the frozen executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\PhotoRounds.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoRounds-windows
          path: dist/PhotoRounds.exe

      - name: Publish to the app-latest release (stable download link)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="app-latest"
          notes="Standalone Windows app — download PhotoRounds.exe below and double-click to run.
          No installation needed. If Windows SmartScreen warns, click 'More info' then 'Run anyway'
          (the file is unsigned, which is normal for personal builds).
          HEIC and RAW support are built in; install ExifTool and ffmpeg separately for best
          RAW/video dates and video conversion (see README)."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/PhotoRounds.exe --clobber
          else
            gh release create "$tag" dist/PhotoRounds.exe \
              --target "$GITHUB_SHA" \
              --title "PhotoRounds for Windows — latest build" \
              --notes "$notes"
          fi
